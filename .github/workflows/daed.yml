name: Build Universal daed for aarch64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zstd build-essential libncurses-dev unzip wget

      - name: Setup ImmortalWrt SDK for aarch64_cortex-a53
        run: |
          BASE="https://downloads.immortalwrt.org/snapshots/targets/qualcommax/ipq60xx"
          SDK_FILE=$(wget -qO- "$BASE/" | grep -o 'immortalwrt-sdk-[^"]*Linux-x86_64.tar.zst' | head -n1)
          echo "Using SDK: $SDK_FILE"
          wget -q "$BASE/$SDK_FILE" -O sdk.tar.zst
          tar --zstd -xf sdk.tar.zst
          mv immortalwrt-sdk-* sdk

      - name: Copy package source
        run: |
          mkdir -p sdk/package/daed
          # 假设你的 Makefile 和 files 目录在仓库根目录的 package/daed 下
          cp -r ./packages/daed/* sdk/package/daed/

      - name: Update feeds and build
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          # 启用 daed 包
          echo "CONFIG_PACKAGE_daed=m" >> .config
          # 确保 SDK 本身支持 BTF（如果尚未默认开启）
          echo "CONFIG_KERNEL_DEBUG_INFO_BTF=y" >> .config
          echo "CONFIG_KERNEL_BPF_EVENTS=y" >> .config
          echo "CONFIG_KERNEL_CGROUP_BPF=y" >> .config
          make package/daed/compile V=s

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: daed-aarch64-universal
          # 产物路径可能因 SDK 结构而异，通常是 base 或 packages 目录
          path: sdk/bin/packages/aarch64_cortex-a53/base/daed*.apk
